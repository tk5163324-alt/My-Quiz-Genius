{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizGenius AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="/">
                QuizGenius AI
            </a>

            <div>

                {% if user.is_authenticated %}

                    <a href="/dashboard/" class="btn btn-outline-light me-2">
                        Dashboard
                    </a>

                    <a href="/generate/" class="btn btn-outline-light me-2">
                        Generate Quiz
                    </a>

                    <a href="/leaderboard/" class="btn btn-outline-light me-2">
                        Leaderboard
                    </a>

                    <a href="/profile/" class="btn btn-outline-light me-2">
                        Profile
                    </a>

                    <a href="/logout/" class="btn btn-danger">
                        Logout
                    </a>

                {% else %}

                    <a href="/login/" class="btn btn-outline-light me-2">
                        Login
                    </a>

                    <a href="/register/" class="btn btn-success">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>

    <!-- Main Content -->
    <main class="container py-5 flex-grow-1">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">

        <div class="container">

            <p class="mb-0">
                © 2026 QuizGenius AI |
                Smart AI Question Generator &
                Interview Preparation Platform
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
